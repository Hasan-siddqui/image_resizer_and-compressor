<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title & Meta Description -->
    <title>Image Resizer & Compressor - Free Online Tool</title>
    <meta name="description"
        content="Resize and compress images online for free. Optimize your images with high-quality compression and aspect ratio lock.">
    <meta name="keywords"
        content="image resizer, image compressor, resize images online, compress images, free image optimization, online image resizer">

    <!-- Author & Robots -->
    <meta name="author" content="Hasan Siddqui">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (For Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Image Resizer & Compressor - Free Online Tool">
    <meta property="og:description"
        content="Easily resize and compress images online. Adjust quality, maintain aspect ratio, and download optimized images.">
    <meta property="og:image" content="https://hasan-siddqui.github.io/image_resizer_and-compressor/preview.jpg">
    <meta property="og:url" content="https://hasan-siddqui.github.io/image_resizer_and-compressor/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Image Resizer & Compressor - Free Online Tool">
    <meta name="twitter:description"
        content="Optimize and compress images effortlessly. Adjust size, quality, and format with our online image resizer.">
    <meta name="twitter:image" content="https://hasan-siddqui.github.io/image_resizer_and-compressor/preview.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hasan-siddqui.github.io/image_resizer_and-compressor/">

    <!-- Favicon -->
    <!-- <link rel="icon" href="favicon.ico" type="image/x-icon"> -->
    <!-- Structured Data (JSON-LD for Rich Results) -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "Image Resizer & Compressor",
            "description": "Resize and compress images online for free. Adjust width, height, and quality while maintaining aspect ratio.",
            "image": "https://hasan-siddqui.github.io/image_resizer_and-compressor/preview.jpg",
            "url": "https://hasan-siddqui.github.io/image_resizer_and-compressor/",
            "creator": {
                "@type": "Person",
                "name": "Hasan Siddqui"
            },
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web-based",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            }
        }
        </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Free Online Image Resizer & Compressor – Optimize Images Instantly</h1>
        <div class="drop-area" id="dropArea">
            <p>Drag & Drop an Image Here or Click to Upload</p>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <div class="preview-container">
            <img id="previewImg" class="preview-img" src="#" alt="Image Preview" style="display: none;">
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="widthInput">Width:</label>
                <input type="number" id="widthInput" placeholder="Auto">
            </div>
            <div class="control-group">
                <label for="heightInput">Height:</label>
                <input type="number" id="heightInput" placeholder="Auto">
            </div>
            <div class="control-group">
                <label for="aspectRatioLock">Lock Aspect Ratio:</label>
                <input type="checkbox" id="aspectRatioLock" checked>
            </div>
            <div class="control-group">
                <label for="fileTypeSelect">File Type:</label>
                <select id="fileTypeSelect">
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>
            <div class="control-group">
                <label for="qualityInput">Quality (0.1 - 1.0):</label>
                <input type="number" id="qualityInput" min="0.1" max="1.0" step="0.1" value="0.8">
            </div>
        </div>
        <button onclick="applyResize()">Resize & Compress</button>
        <div class="loading-spinner" id="loadingSpinner">Processing...</div>
        <div class="error-message" id="errorMessage"></div>
        <a id="downloadLink" class="download-link">Download Image</a>
    </div>
    <script src="script.js"></script>
</body>

</html>
